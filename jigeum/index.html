<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="지금">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>지금 — 하나씩</title>
<style>
  :root{
    --paper:#F4EFE7; --card:#FBF8F3; --ink:#262019; --muted:#8C8375;
    --line:#E4DCCF; --now:#137A6B; --now-soft:#DCEDE9;
    --late:#C8492F; --late-soft:#F6E2DC; --asap:#B5761A; --asap-soft:#F3E7CF;
    --done:#4F8C63; --done-soft:#DFEDE3; --todo:var(--late);
    --shadow:0 1px 2px rgba(38,32,25,.04), 0 8px 24px rgba(38,32,25,.06);
    --r:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#171512; --card:#211E19; --ink:#EDE6DA; --muted:#9A9082;
      --line:#332E27; --now:#3FBDA8; --now-soft:#12332E;
      --late:#E8735A; --late-soft:#361F19; --asap:#D19A3E; --asap-soft:#33280F;
      --done:#5FB37C; --done-soft:#17301F; --todo:var(--late);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,"Malgun Gothic",sans-serif;
    line-height:1.45; padding:max(14px,env(safe-area-inset-top)) 14px calc(128px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .greet{display:flex; align-items:baseline; justify-content:space-between; margin:6px 4px 14px}
  .greet h1{font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0}
  .greet .sub{font-size:13px; color:var(--muted); font-weight:600}

  /* tabs */
  .tabs{display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px; margin-bottom:20px}
  .tabs button{flex:1; border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:14px; font-weight:700; padding:10px; border-radius:10px; cursor:pointer}
  .tabs button.active{background:var(--now); color:#fff}

  .now-label{font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--now); margin:0 6px 8px; text-transform:uppercase}
  .now-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:26px 22px 22px; position:relative; overflow:hidden; margin-bottom:24px}
  .now-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--now)}
  .now-card.late::before{background:var(--late)}
  .now-card.asap::before{background:var(--asap)}
  .now-text{font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.25; word-break:keep-all}
  .now-meta{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}
  .chip{font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:999px; background:var(--now-soft); color:var(--now)}
  .chip.late{background:var(--late-soft); color:var(--late)} .chip.asap{background:var(--asap-soft); color:var(--asap)}
  .chip.plain{background:transparent; color:var(--muted); padding-left:2px}
  .now-done{margin-top:20px; width:100%; border:0; border-radius:14px; background:var(--now); color:#fff; font-size:17px; font-weight:800; padding:16px; cursor:pointer; font-family:inherit; transition:transform .08s}
  .now-done:active{transform:scale(.98)}
  .now-empty{background:var(--card); border:1px dashed var(--line); border-radius:var(--r); padding:30px 22px; text-align:center; color:var(--muted); font-weight:600; margin-bottom:24px}
  .now-empty b{color:var(--ink); display:block; font-size:17px; margin-bottom:4px}

  .sec{margin:20px 0 8px; display:flex; align-items:center; gap:8px}
  .sec h2{font-size:13.5px; font-weight:800; margin:0}
  .sec .dot{width:8px; height:8px; border-radius:50%}
  .sec.due .dot{background:var(--now)} .sec.asap .dot{background:var(--asap)} .sec.someday .dot{background:var(--muted)}
  .sec .count{font-size:12px; font-weight:700; color:var(--muted); background:var(--line); padding:2px 8px; border-radius:999px; margin-left:auto}
  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
  li.task{display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px; animation:rise .2s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .check{flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:2px solid var(--line); margin-top:1px; cursor:pointer; background:transparent; display:grid; place-items:center; transition:.15s; color:#fff; font-size:13px}
  .check:active{transform:scale(.9)}
  .check.done{background:var(--done); border-color:var(--done)}
  li.task .body{flex:1; min-width:0}
  li.task .t{font-size:15.5px; font-weight:600; word-break:keep-all}
  li.task.isdone .t{text-decoration:line-through; color:var(--muted)}
  li.task .m{font-size:12px; color:var(--muted); font-weight:600; margin-top:3px}
  li.task .m .u{color:var(--late)} li.task .m .a{color:var(--asap)}
  .tel{color:var(--now); text-decoration:none; border-bottom:1px dashed currentColor}
  .del{flex:0 0 auto; border:0; background:transparent; color:var(--muted); font-size:19px; line-height:1; padding:2px 4px; cursor:pointer; opacity:.5}

  .srch-btn{border:0; background:transparent; font-size:17px; cursor:pointer; padding:2px 0 2px 10px; line-height:1}
  .srch-hit{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:6px; cursor:pointer}
  .srch-hit .w{font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:2px}
  .srch-hit .x{font-size:15px; font-weight:600; word-break:keep-all}
  .srch-hit .nt{font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:600}
  .set-row{display:flex; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid var(--line)}
  .set-row:last-child{border-bottom:0}
  .set-row .lab{flex:1; min-width:0}
  .set-row .lab b{display:block; font-size:14.5px; font-weight:700}
  .set-row .lab span{font-size:12px; color:var(--muted); font-weight:600}
  .set-row button{border:1.5px solid var(--line); background:transparent; color:inherit; font-family:inherit; font-size:13px; font-weight:800; padding:9px 14px; border-radius:10px; cursor:pointer; white-space:nowrap}
  .set-row button.on{background:var(--now); border-color:var(--now); color:#fff}
  .bk-warn{display:block; width:100%; text-align:left; margin-top:20px; border:1px solid var(--asap); background:var(--asap-soft); color:var(--asap); font-family:inherit; font-size:12.5px; font-weight:700; padding:11px 14px; border-radius:12px; cursor:pointer}
  .later-row{display:flex; gap:8px; margin-top:26px; flex-wrap:wrap}
  .later{border:1px dashed var(--line); background:transparent; color:var(--muted); font-family:inherit; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer}
  .later.on{border-style:solid; border-color:var(--now); color:var(--now)}

  /* calendar */
  .cal-head{display:flex; align-items:center; justify-content:center; gap:18px; margin:2px 0 14px}
  .cal-head button{border:0; background:var(--card); border:1px solid var(--line); width:38px; height:38px; border-radius:12px; font-size:18px; cursor:pointer; color:var(--ink)}
  .cal-head span{font-size:17px; font-weight:800; min-width:120px; text-align:center}
  .cal-wd{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .cal-wd .wd{text-align:center; font-size:11px; font-weight:700; color:var(--muted); padding-bottom:4px}
  .cal-wd .wd.sun{color:var(--late)}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; gap:5px; transition:height .22s ease}
  .cell{border-radius:11px; border:1px solid transparent; display:flex; flex-direction:column; align-items:center; padding:5px 3px 3px; font-size:13px; font-weight:600; cursor:pointer; position:relative; color:var(--ink); overflow:hidden; min-height:42px}
  .cell.pad{cursor:default}
  .cell.has{background:var(--card); border-color:var(--line)}
  .cell .n{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; font-size:12.5px; border-radius:50%; flex:0 0 auto}
  .cell.today .n{background:var(--now); color:#fff; font-weight:800}
  .cell.sel{outline:2px solid var(--now); outline-offset:1px}
  .cell .dots{display:flex; gap:3px; margin-top:3px}
  .cell .d{width:6px; height:6px; border-radius:50%; background:var(--todo)}
  .cell .d.done{background:var(--done)}
  /* 펼친 달력: 점 대신 일정 제목 */
  .cal-grid.big{align-content:stretch}
  .cal-grid.big .cell{align-items:stretch}
  .cal-grid.big .cell .n{align-self:center}
  .cal-grid.big .dots{display:none}
  .cal-grid:not(.big) .mini{display:none}
  .mini{width:100%; margin-top:3px; display:flex; flex-direction:column; gap:2px; overflow:hidden}
  .mini .m{font-size:9.5px; font-weight:700; flex:0 0 auto; line-height:1.25; padding:2px 3px; border-radius:4px; text-align:left; word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .mini .m.todo{background:var(--late-soft); color:var(--late)}
  .mini .m.done{background:var(--done-soft); color:var(--done)}
  .mini .more{font-size:9px; font-weight:700; color:var(--muted); text-align:left; padding-left:3px}
  .cal-legend{display:flex; gap:14px; justify-content:center; margin-top:10px; font-size:11px; font-weight:700; color:var(--muted)}
  .cal-legend i{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px}
  .cal-legend .lt i{background:var(--todo)} .cal-legend .ld i{background:var(--done)}
  .cal-day{margin-top:18px}
  .cal-day h3{font-size:14px; font-weight:800; margin:0 4px 8px}

  /* done log */
  .log-day{margin-bottom:18px}
  .log-day h3{font-size:13px; font-weight:800; color:var(--muted); margin:0 4px 8px}
  .log-item{display:flex; gap:10px; align-items:baseline; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:6px}
  .log-item .time{font-size:12px; font-weight:700; color:var(--done); flex:0 0 auto; min-width:52px}
  .log-item .txt{font-size:15px; font-weight:600; word-break:keep-all}
  .log-empty{color:var(--muted); text-align:center; padding:40px 20px; font-weight:600}

  /* composer */
  .composer{position:fixed; left:0; right:0; bottom:0; background:linear-gradient(to top, var(--paper) 72%, transparent); padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
  .composer .inner{max-width:560px; margin:0 auto}
  .modes{display:flex; gap:6px; margin-bottom:8px}
  .modes button{border:1px solid var(--line); background:var(--card); color:var(--muted); font-family:inherit; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer}
  .modes button.on{background:var(--done); color:#fff; border-color:var(--done)}
  .row{display:flex; gap:10px; align-items:center}
  #box{flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:16px; padding:15px 16px; font-size:16px; font-family:inherit; box-shadow:var(--shadow)}
  #box:focus{outline:2px solid var(--now); outline-offset:1px}
  .mic,.add{flex:0 0 auto; width:54px; height:54px; border-radius:16px; border:0; cursor:pointer; font-size:22px; display:grid; place-items:center; box-shadow:var(--shadow); font-family:inherit}
  .mic{background:var(--card); border:1px solid var(--line); color:var(--ink)}
  .mic.on{background:var(--late); color:#fff; animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,73,47,.4)}50%{box-shadow:0 0 0 10px rgba(200,73,47,0)}}
  .add{background:var(--now); color:#fff; font-weight:800}
  .vbtn{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;text-decoration:underline dotted;padding:0}
  .ver{text-align:center; font-size:10px; color:var(--muted); opacity:.5; margin-top:3px; font-weight:600}
  .hint{max-width:560px; margin:7px auto 0; font-size:11.5px; color:var(--muted); text-align:center; font-weight:600}

  .log-item[data-edit],.task .body[data-edit]{cursor:pointer}
  .memo{font-size:12px;opacity:.75}
  .sheet textarea{width:100%;min-height:110px;padding:12px 14px;border:1.5px solid var(--line,#ddd);border-radius:12px;font:inherit;font-size:15px;line-height:1.6;background:transparent;color:inherit;resize:vertical}
  .sheet input[type=text],.sheet input[type=date],.sheet input[type=time]{padding:11px 13px;border:1.5px solid var(--line,#ddd);border-radius:12px;font:inherit;font-size:15px;background:transparent;color:inherit}
  .sheet .f{display:flex;gap:8px;align-items:center;margin-top:6px}
  .sheet .f input[type=date]{flex:1;min-width:0}
  .sheet .btns{display:flex;gap:8px;margin-top:20px}
  .sheet .btns button{flex:1;padding:14px;border:0;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer}
  .sheet .save{background:var(--now,#137A6B);color:#fff}
  .sheet .ghost{background:transparent;border:1.5px solid var(--line,#ddd)!important;color:inherit}
  .sheet .danger{background:transparent;color:#c8492f;border:1.5px solid #c8492f!important;flex:0 0 84px}
  .sheet .memo-row{display:flex;gap:8px;align-items:flex-start}
  .sheet .memo-row button{flex:0 0 46px;height:46px;border:1.5px solid var(--line,#ddd);border-radius:12px;background:transparent;font-size:19px;cursor:pointer}
  .sheet .memo-row button.on{background:var(--now,#137A6B);border-color:transparent;animation:pulse 1.3s infinite}
  /* 날짜 상세 모달 */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card,#fff);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 26px;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .18s ease-out}
  @media(min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
  @keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sheet-top h3{margin:0;font-size:18px}
  .sheet-top .x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
  .sheet .lbl{font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 6px}
  .sheet .none{color:var(--muted);font-weight:600;margin:8px 2px}
  .sheet .drow{display:flex;gap:8px;margin-top:8px}
  .sheet .drow input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line,#ddd);border-radius:12px;font-size:15px;background:transparent;color:inherit}
  .sheet .drow button{padding:12px 14px;border:0;border-radius:12px;background:var(--done,#137A6B);color:#fff;font-weight:800;white-space:nowrap;cursor:pointer}
  .sheet .dmode{display:flex;gap:6px;margin-top:8px}
  .sheet .dmode button{flex:1;padding:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:800;border-radius:999px;cursor:pointer}
  .sheet .dmode button.on{background:var(--now);border-color:var(--now);color:#fff}
  @media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
  <div class="greet"><h1 id="greetTitle">좋은 아침</h1><div class="sub" id="greetSub"></div><button class="srch-btn" id="searchBtn" aria-label="검색">🔍</button><button class="srch-btn" id="setBtn" aria-label="설정">⚙️</button></div>
  <div class="tabs">
    <button data-view="now" class="active">지금</button>
    <button data-view="cal">달력</button>
  </div>
  <div id="screen"></div>

  <div class="composer"><div class="inner">
    <div class="modes">
      <button id="mTodo" class="on">＋ 할 일</button>
      <button id="mDone">✓ 한 일 기록</button>
    </div>
    <div class="row">
      <input id="box" placeholder="할 일 (예: 내일 오후 3시 병원 예약)" autocomplete="off" enterkeyhint="done">
      <button class="mic" id="mic" aria-label="음성으로 추가">🎙️</button>
      <button class="add" id="add" aria-label="추가">＋</button>
    </div>
    <div class="hint" id="hint">🎙️ 말하거나 적고 ＋. 날짜·"빨리"·"급함"은 자동 인식해요.</div>
    <div class="ver"><span id="ver"></span></div>
  </div></div>

<script>
const KEY='jigeum.tasks.v1';
let tasks=load(); let view='now'; let addMode='todo'; let dayAddMode='done'; let showSomeday=false;
/* 보정: "한 일"인데 기록 시각이 아직 오지 않은 항목 = 실제로는 예정된 할 일.
   (예전 달력 상세창이 미래 날짜도 완료로 저장하던 버그의 흔적을 되돌린다) */
let fixedFutureDone=0;
tasks.forEach(t=>{ if(t.done&&t.completedAt&&t.completedAt>Date.now()){ t.done=false; t.due=t.due||t.completedAt; t.completedAt=null; fixedFutureDone++; } });
if(fixedFutureDone)save();
let calY, calM, calSel=null;
(()=>{const n=new Date(); calY=n.getFullYear(); calM=n.getMonth();})();

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const endOfToday=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),23,59,59,999).getTime()};
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

/* ---- 파싱 ---- */
function parseKorean(raw,preferPast){
  let text=raw.trim(); const now=new Date();
  const midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const urgent=/(급함|급해|긴급|중요|asap|당장)/i.test(text);
  const asap=/(최대한\s*빨리|되도록\s*빨리|빨리|얼른|서둘러)/.test(text);
  let day=null;
  if(/그저께|그제|엊그제/.test(text))day=addDays(midnight,-2);
  else if(/어제|어저께/.test(text))day=addDays(midnight,-1);
  else if(/모레|내일\s*모레/.test(text))day=addDays(midnight,2);
  else if(/글피/.test(text))day=addDays(midnight,3);
  else if(/내일/.test(text))day=addDays(midnight,1);
  else if(/오늘/.test(text))day=new Date(midnight);
  const ago=text.match(/(\d{1,2})\s*일\s*(전|앞)/); if(ago&&!day)day=addDays(midnight,-(+ago[1]));
  const wd=text.match(/(다음\s*주|담주|이번\s*주|지난\s*주|저번\s*주)?\s*([일월화수목금토])요일/);
  if(wd&&!day){const target='일월화수목금토'.indexOf(wd[2]);
    if(preferPast||/지난|저번/.test(wd[1]||'')){let diff=(midnight.getDay()-target+7)%7; if(diff===0)diff=7; day=addDays(midnight,-diff);}
    else{let diff=(target-midnight.getDay()+7)%7; if(/다음|담/.test(wd[1]||''))diff+=7; if(diff===0&&!/이번/.test(wd[1]||''))diff=7; day=addDays(midnight,diff);}}
  const md=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(md){let y=now.getFullYear(); let d=new Date(y,+md[1]-1,+md[2]);
    if(preferPast){if(d>midnight)d=new Date(y-1,+md[1]-1,+md[2]);}
    else if(d<midnight)d=new Date(y+1,+md[1]-1,+md[2]);
    day=d;}
  let due=null;
  const tm=text.match(/(오전|오후|아침|점심|저녁|밤|새벽)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분)?/);
  if(tm){let h=+tm[2]; const min=tm[3]?+tm[3]:0; const ap=tm[1]||''; if(/오후|저녁|밤/.test(ap)&&h<12)h+=12; if(/점심/.test(ap))h=12; if(/오전|아침|새벽/.test(ap)&&h===12)h=0; if(!ap&&h<=7)h+=12; const base=day||new Date(midnight); due=new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,min).getTime(); if(due<now.getTime()&&!day&&!preferPast)due+=86400000;}
  else if(day){due=new Date(day.getFullYear(),day.getMonth(),day.getDate(),9,0).getTime();}
  // 표시 텍스트에서 뒤쪽 우선순위 태그어 정리
  let clean=text.replace(/\s*(급함|급해|긴급|중요|최대한\s*빨리|되도록\s*빨리|빨리|얼른|서둘러|asap)\s*$/i,'').trim()||text;
  return {due,urgent,asap,clean};
}

/* ---- 우선순위 ---- */
function priority(t){
  const now=Date.now(), dayEnd=endOfToday();
  if(t.due&&t.due<now)return 0;
  if(t.urgent&&(!t.due||t.due<=dayEnd))return 1;
  if(t.due&&t.due<=dayEnd)return 2;
  if(t.asap)return 2.3;
  if(t.urgent)return 2.6;
  if(t.due)return 3;
  return 4;
}
function active(){return tasks.filter(t=>!t.done).sort((a,b)=>{const pa=priority(a),pb=priority(b); if(pa!==pb)return pa-pb; const da=a.due??Infinity,db=b.due??Infinity; if(da!==db)return da-db; return a.created-b.created;})}
function kindOf(t){return t.due?'due':t.asap?'asap':'someday'}

/* ---- 포맷 ---- */
function fmtDue(due,urgent,asap){
  if(!due)return urgent?{txt:'급함',cls:'late'}:asap?{txt:'빨리',cls:'asap'}:null;
  const d=new Date(due),now=new Date();
  const days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  const hm=(d.getHours()||d.getMinutes())?` ${d.getHours()>=12?'오후':'오전'} ${((d.getHours()+11)%12)+1}시${d.getMinutes()?d.getMinutes()+'분':''}`:'';
  let day=days===0?'오늘':days===1?'내일':days===2?'모레':days===-1?'어제':days<0?`${-days}일 지남`:days<7?`${days}일 뒤`:`${d.getMonth()+1}/${d.getDate()}`;
  return {txt:day+hm, cls:due<Date.now()?'late':''};
}
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};

/* ---- 렌더 ---- */
function render(){
  const h=new Date().getHours();
  document.getElementById('greetTitle').textContent=h<5?'늦은 밤':h<11?'좋은 아침':h<14?'점심 즈음':h<18?'오후예요':h<22?'저녁이에요':'늦은 밤';
  const act=active();
  const todayCnt=act.filter(t=>priority(t)<=2.6).length, urg=act.filter(t=>t.urgent).length;
  const doneToday=tasks.filter(t=>t.done&&t.completedAt&&dayKey(t.completedAt)===dayKey(Date.now())).length;
  document.getElementById('greetSub').textContent=`오늘 ${todayCnt}${urg?` · 급함 ${urg}`:''} · 한 일 ${doneToday}`;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const s=document.getElementById('screen');
  s.innerHTML = view==='now'?viewNow(act) : view==='cal'?viewCal() : viewLog();
  if(view==='cal')fitCal();
}

/* 달력을 화면 아래까지 채운다. 날짜를 고르면 목록 자리를 내주고 줄어든다. */
function fitCal(){
  const g=document.querySelector('.cal-grid'); if(!g)return;
  const rows=Math.ceil(g.children.length/7);
  const gap=5;
  if(g.classList.contains('big')){
    const composer=document.querySelector('.composer');
    const bottom=(composer?composer.offsetHeight:120)+12;
    const avail=window.innerHeight-g.getBoundingClientRect().top-bottom;
    const rowH=Math.max(46,Math.min(96,(avail-gap*(rows-1))/rows));
    g.style.height=(rowH*rows+gap*(rows-1))+'px';
  }else{
    g.style.height=(46*rows+gap*(rows-1))+'px';
  }
}
window.addEventListener('resize',()=>{if(view==='cal')fitCal();});

function viewNow(all){

  const now=act[0];
  let html='<p class="now-label">지금</p>';
  if(!now){html+='<div class="now-empty"><b>오늘 할 일은 없어요</b>'+(soon.length?'앞으로 예정된 건 달력에 있어요.':'할 일을 말하거나 아래에 적어보세요.')+'</div>';}
  else{

    html+=`<div class="now-card ${cls}"><div class="now-text">${tel(esc(now.text))}</div><div class="now-meta">

  for(const [k,name,arr] of groups){ if(!arr.length)continue;
    html+=`<div class="sec ${k}"><span class="dot"></span><h2>${name}</h2><span class="count">${arr.length}</span></div><ul>`;
    for(const t of arr) html+=taskLi(t);
    html+='</ul>';
  }
  // 오늘 일이 아닌 것들은 화면에서 치우고 줄 하나로만 알린다

    if(someday.length)html+=`<button class="later ${showSomeday?'on':''}" data-someday="1">언젠가 ${someday.length}개</button>`;
    html+='</div>';

  }

function taskLi(t){
  const m=fmtDue(t.due,t.urgent,t.asap);
  const meta = m ? `<div class="m">${t.urgent?'<span class="u">● 급함</span> · ':''}${m.txt}</div>` : '';

  return `<li class="task"><button class="check" data-done="${t.id}" aria-label="완료"></button>
    <div class="body" data-edit="${t.id}"><div class="t">${tel(esc(t.text))}${memo}</div>${meta}</div>
    <button class="del" data-del="${t.id}" aria-label="삭제">×</button></li>`;
}

function logRow(t){const d2=new Date(t.completedAt); const tm=`${d2.getHours()>=12?'오후':'오전'} ${((d2.getHours()+11)%12)+1}:${String(d2.getMinutes()).padStart(2,'0')}`; return `<div class="log-item" data-edit="${t.id}"><span class="time">${tm}</span><span class="txt">${tel(esc(t.text))}${t.note?' <span class="memo">📝</span>':''}</span></div>`;}
/* 글 속 전화번호를 눌러서 바로 걸 수 있게 만든다 (esc() 뒤에만 쓸 것) */
const TEL_RE=/((?:0\d{1,2}|1[5-9]\d{2})[-.\s]?\d{3,4}[-.\s]?\d{4})/g;
function tel(s){return s.replace(TEL_RE,m=>`<a class="tel" href="tel:${m.replace(/[^0-9]/g,'')}">${m}</a>`);}
function viewCal(){
  const first=new Date(calY,calM,1), startDow=first.getDay(), dim=new Date(calY,calM+1,0).getDate();
  const dueBy={}, doneBy={};
  tasks.filter(t=>t.due&&!t.done).forEach(t=>{const k=dayKey(t.due); (dueBy[k]=dueBy[k]||[]).push(t);});
  tasks.filter(t=>t.done&&t.completedAt).forEach(t=>{const k=dayKey(t.completedAt); (doneBy[k]=doneBy[k]||[]).push(t);});
  const now=new Date();
  let html=`<div class="cal-head"><button data-cal="-1">‹</button><span>${calY}년 ${calM+1}월</span><button data-cal="1">›</button></div><div class="cal-wd">`;
  ['일','월','화','수','목','금','토'].forEach((w,i)=>html+=`<div class="wd ${i===0?'sun':''}">${w}</div>`);
  html+=`</div><div class="cal-grid ${calSel?'':'big'}">`;
  for(let i=0;i<startDow;i++)html+='<div class="cell pad"></div>';
  for(let d=1;d<=dim;d++){
    const k=calY+'-'+calM+'-'+d, due=dueBy[k]||[], done=doneBy[k]||[];
    const has=due.length||done.length;
    const isToday=now.getFullYear()===calY&&now.getMonth()===calM&&now.getDate()===d;
    const sel=calSel===k;
    // 점: 할 일(미완료)=빨강, 한 일(완료)=초록
    let dots='';
    if(has){dots='<div class="dots">';
      if(due.length)dots+='<span class="d"></span>';
      if(done.length)dots+='<span class="d done"></span>'; dots+='</div>';}
    // 펼친 상태에서 칸 안에 보여줄 제목들 (할 일 먼저)
    let mini='';
    if(has){
      const items=[...due.map(t=>({c:'todo',x:t.text})),...done.map(t=>({c:'done',x:t.text}))];
      mini='<div class="mini">'+items.slice(0,2).map(i=>`<span class="m ${i.c}">${esc(i.x)}</span>`).join('');
      if(items.length>2)mini+=`<span class="more">+${items.length-2}</span>`;
      mini+='</div>';
    }
    html+=`<div class="cell ${has?'has':''} ${isToday?'today':''} ${sel?'sel':''}" data-day="${k}"><span class="n">${d}</span>${dots}${mini}</div>`;
  }
  html+='</div><div class="cal-legend"><span class="lt"><i></i>할 일</span><span class="ld"><i></i>한 일</span></div>';
  if(calSel){
    const [yy,mm,dd]=calSel.split('-').map(Number);
    const due=dueBy[calSel]||[], done=doneBy[calSel]||[];
    html+=`<div class="cal-day"><h3>${mm+1}월 ${dd}일</h3>`;
    if(due.length){html+='<ul>'; due.sort((a,b)=>a.due-b.due).forEach(t=>html+=taskLi(t)); html+='</ul>';}
    if(done.length){html+=`<div class="sec someday" style="margin-top:14px"><span class="dot" style="background:var(--done)"></span><h2>한 일</h2><span class="count">${done.length}</span></div>`; done.sort((a,b)=>b.completedAt-a.completedAt).forEach(t=>html+=logRow(t));}
    if(!due.length&&!done.length)html+='<p style="color:var(--muted);font-weight:600;margin:6px 4px">이 날은 기록이 없어요.</p>';
    html+='</div>';
  }
  return html;
}

function viewLog(){
  const done=tasks.filter(t=>t.done&&t.completedAt).sort((a,b)=>b.completedAt-a.completedAt);
  if(!done.length)return '<div class="log-empty">아직 한 일 기록이 없어요.<br>완료하거나 "✓ 한 일 기록"으로 남겨보세요.</div>';
  const groups={}; done.forEach(t=>{(groups[dayKey(t.completedAt)]=groups[dayKey(t.completedAt)]||[]).push(t);});
  const today=dayKey(Date.now()), yest=dayKey(Date.now()-86400000);
  let html='';
  for(const k of Object.keys(groups)){
    const [y,m,d]=k.split('-').map(Number);
    const label=k===today?`오늘 · ${groups[k].length}개`:k===yest?`어제 · ${groups[k].length}개`:`${m+1}월 ${d}일 · ${groups[k].length}개`;
    html+=`<div class="log-day"><h3>${label}</h3>`;
    groups[k].forEach(t=>{html+=logRow(t);});
    html+='</div>';
  }
  return html;
}

function add(text){

  const {due,urgent,asap,clean}=parseKorean(text);

    const base=ta.value?ta.value.replace(/\s*$/,'')+' ':'';
    memoRec.onstart=()=>btn.classList.add('on');
    memoRec.onresult=ev=>{let f='',i='';for(let k=0;k<ev.results.length;k++){const r=ev.results[k]; r.isFinal?f+=r[0].transcript+' ':i+=r[0].transcript;} ta.value=base+f+i;};
    memoRec.onend=()=>{btn.classList.remove('on'); memoRec=null;};
    memoRec.onerror=()=>{btn.classList.remove('on'); memoRec=null;};
    memoRec.start(); return;}
});

/* ---------- 백업 ----------
   기록은 이 폰 크롬 안에만 있다. 크롬의 "쿠키 및 사이트 데이터"를 지우면 같이 날아간다.
   (앱으로 설치해도 저장소는 크롬과 공유하므로 마찬가지) 그래서 파일로 빼두는 길을 만든다. */
const BKKEY=KEY+'.lastbackup';
function lastBackup(){const v=+localStorage.getItem(BKKEY); return v||0;}
function backupAgeDays(){const v=lastBackup(); return v?Math.floor((Date.now()-v)/86400000):null;}
function exportBackup(){
  const data={app:'jigeum', ver:1, exportedAt:new Date().toISOString(), tasks};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a'), d=new Date();
  a.href=url; a.download=`지금-백업-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  localStorage.setItem(BKKEY,String(Date.now()));
  setMsg(`${tasks.length}개를 파일로 내보냈어요. 드라이브나 카톡에 옮겨두세요.`);
  render();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    let arr=null;
    try{const d=JSON.parse(r.result); arr=Array.isArray(d)?d:d.tasks;}catch(e){}
    if(!Array.isArray(arr)){setMsg('이 파일은 지금 앱 백업이 아니에요.'); return;}
    // 합치기만 한다 — 같은 id는 건드리지 않아서 기존 기록이 지워질 일이 없다
    const have=new Set(tasks.map(t=>t.id)); let added=0;
    arr.forEach(t=>{
      if(!t||!t.id||typeof t.text!=='string'||have.has(t.id))return;
      tasks.push({id:t.id,text:t.text,due:t.due||null,urgent:!!t.urgent,asap:!!t.asap,
                  done:!!t.done,completedAt:t.completedAt||null,note:t.note||null,created:t.created||Date.now()});
      have.add(t.id); added++;
    });
    save(); render();
    setMsg(added?`${added}개를 되살렸어요.`:'이미 다 있는 기록이었어요.');
  };
  r.onerror=()=>setMsg('파일을 읽지 못했어요.');
  r.readAsText(file);
}
function setMsg(t){const h=document.getElementById('hint'); if(h)h.textContent=t;}

/* ---------- 설정 ---------- */
function openSet(){
  const age=backupAgeDays();
  const bk = age===null ? '아직 한 번도 안 했어요' : age===0 ? '오늘 했어요' : `${age}일 전`;
  const wrap=document.createElement('div'); wrap.className='sheet-bg'; wrap.id='setBg';
  wrap.innerHTML=`<div class="sheet" role="dialog" aria-label="설정">
    <div class="sheet-top"><h3>설정</h3><button class="x" data-xclose="1" aria-label="닫기">✕</button></div>
    <div class="set-row"><div class="lab"><b>열면 바로 듣기</b><span>앱을 열자마자 마이크가 켜져요</span></div>
      <button data-automic="1" class="${autoMic?'on':''}">${autoMic?'켜짐':'꺼짐'}</button></div>
    <div class="set-row"><div class="lab"><b>백업 내보내기</b><span>마지막 백업: ${bk} · 기록 ${tasks.length}개</span></div>
      <button data-bkout="1">내보내기</button></div>
    <div class="set-row"><div class="lab"><b>백업 가져오기</b><span>없는 기록만 더해요. 지워지지 않아요</span></div>
      <button data-bkin="1">가져오기</button></div>
    <input type="file" id="bkFile" accept="application/json,.json" style="display:none">
    <p class="none" style="font-size:12px;margin-top:16px">기록은 이 폰 안에만 있어요. 크롬에서 "쿠키 및 사이트 데이터"를 지우면 같이 사라집니다. 지우기 전에 내보내기 한 번 눌러주세요.</p>
    <p class="none" style="font-size:11px;margin-top:8px;opacity:.6">${APP_VER}</p>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById('bkFile').onchange=ev=>{const f=ev.target.files&&ev.target.files[0]; if(f){closeSet(); importBackup(f);}};
}
function closeSet(){const b=document.getElementById('setBg'); if(b)b.remove();}
document.body.addEventListener('click',e=>{
  const bg=e.target.closest('#setBg'); if(!bg)return;
  if(e.target.closest('[data-xclose]')||e.target.id==='setBg'){closeSet(); return;}
  if(e.target.closest('[data-automic]')){autoMic=!autoMic; localStorage.setItem(MICKEY,autoMic?'1':'0'); closeSet(); openSet(); return;}
  if(e.target.closest('[data-bkout]')){closeSet(); exportBackup(); return;}
  if(e.target.closest('[data-bkin]')){document.getElementById('bkFile').click(); return;}
});

/* ---------- 검색 (기록이 쌓이면 날짜를 기억 못 해도 찾을 수 있게) ---------- */
function openSearch(){
  const wrap=document.createElement('div'); wrap.className='sheet-bg'; wrap.id='srchBg';
  wrap.innerHTML=`<div class="sheet" role="dialog" aria-label="검색">
    <div class="sheet-top"><h3>검색</h3><button class="x" data-sclose="1" aria-label="닫기">✕</button></div>
    <input type="text" id="sQ" placeholder="이름·내용·전화번호" style="width:100%;font-weight:700" autocomplete="off">
    <div id="sOut"></div>
  </div>`;
  document.body.appendChild(wrap);
  const q=document.getElementById('sQ');
  q.addEventListener('input',()=>runSearch(q.value));
  runSearch('');
  setTimeout(()=>q.focus(),40);
}
function runSearch(q){
  const out=document.getElementById('sOut'); if(!out)return;
  q=(q||'').trim().toLowerCase();
  if(!q){out.innerHTML='<p class="none">이름이나 내용을 적으면 할 일과 한 일을 모두 찾아요.</p>'; return;}
  const digits=q.replace(/[^0-9]/g,'');
  const hit=tasks.filter(t=>{
    const hay=((t.text||'')+' '+(t.note||'')).toLowerCase();
    if(hay.includes(q))return true;
    return digits.length>=3 && hay.replace(/[^0-9]/g,'').includes(digits);
  }).sort((a,b)=>(b.completedAt||b.due||b.created)-(a.completedAt||a.due||a.created));
  if(!hit.length){out.innerHTML='<p class="none">못 찾았어요.</p>'; return;}
  out.innerHTML=hit.slice(0,50).map(t=>{
    const when=t.done?t.completedAt:t.due;
    const d=when?new Date(when):null;
    const ws=d?`${d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+'. ':''}${d.getMonth()+1}월 ${d.getDate()}일 ${d.getHours()>=12?'오후':'오전'} ${((d.getHours()+11)%12)+1}:${pad2(d.getMinutes())}`:'날짜 없음';
    return `<div class="srch-hit" data-edit="${t.id}"><div class="w">${t.done?'✓ 한 일':'할 일'} · ${ws}</div>
      <div class="x">${tel(esc(t.text))}</div>${t.note?`<div class="nt">📝 ${tel(esc(t.note))}</div>`:''}</div>`;
  }).join('');
}
function closeSearch(){const b=document.getElementById('srchBg'); if(b)b.remove();}
document.getElementById('searchBtn').onclick=openSearch;
document.body.addEventListener('click',e=>{
  const bg=e.target.closest('#srchBg'); if(!bg)return;
  if(e.target.closest('a.tel'))return;
  if(e.target.closest('[data-sclose]')||e.target.id==='srchBg'){closeSearch(); return;}
  const ed=e.target.closest('[data-edit]');
  if(ed){closeSearch(); openEdit(ed.dataset.edit);}
});

/* ---------- 그날 상세 창 (달력에서 선택된 날짜를 한 번 더 탭) ---------- */
function openDay(key){
  const [y,m,d]=key.split('-').map(Number);
  // 아직 오지 않은 날 = 할 일, 오늘·지난 날 = 한 일 (바꿀 수 있음)
  const t0=new Date(); t0.setHours(0,0,0,0);
  dayAddMode = new Date(y,m,d).getTime()>t0.getTime() ? 'todo' : 'done';
  const nowD=new Date(), isTodayD=(nowD.getFullYear()===y&&nowD.getMonth()===m&&nowD.getDate()===d);
  const defTime = isTodayD ? `${pad2(nowD.getHours())}:${pad2(nowD.getMinutes())}`
                           : (dayAddMode==='todo' ? '09:00' : '12:00');
  const due=tasks.filter(t=>t.due&&!t.done&&dayKey(t.due)===key).sort((a,b)=>a.due-b.due);
  const done=tasks.filter(t=>t.done&&t.completedAt&&dayKey(t.completedAt)===key).sort((a,b)=>a.completedAt-b.completedAt);
  const wrap=document.createElement('div'); wrap.className='sheet-bg'; wrap.id='dayBg'; wrap.dataset.day2=key;
  wrap.innerHTML=`<div class="sheet" role="dialog" aria-label="${m+1}월 ${d}일">
    <div class="sheet-top"><h3>${y}년 ${m+1}월 ${d}일</h3><button class="x" data-dclose="1" aria-label="닫기">✕</button></div>
    ${due.length?`<div class="lbl">할 일 ${due.length}</div><ul style="list-style:none;padding:0;margin:0">${due.map(taskLi).join('')}</ul>`:''}
    ${done.length?`<div class="lbl">한 일 ${done.length}</div>${done.map(logRow).join('')}`:''}
    ${(!due.length&&!done.length)?'<p class="none">이 날은 기록이 없어요.</p>':''}
    <div class="lbl">이 날에 추가</div>
    <div class="dmode">
      <button data-dm="todo" class="${dayAddMode==='todo'?'on':''}">＋ 할 일</button>
      <button data-dm="done" class="${dayAddMode==='done'?'on':''}">✓ 한 일</button>
    </div>
    <div class="drow">
      <input type="text" id="dAdd" placeholder="${dayAddMode==='todo'?'예) 파미르 311호 방문':'예) 김사장 전화 — 파미르 문의'}">
      <button id="dMic" style="flex:0 0 46px">🎙️</button>
    </div>
    <div class="drow">
      <input type="time" id="dTime" value="${defTime}" style="flex:0 0 130px">
      <button data-dsave="1" style="flex:1">${dayAddMode==='todo'?'추가':'기록'}</button>
    </div>
    <p class="none" style="font-size:12px;margin-top:10px">기록한 뒤 그 줄을 탭하면 메모를 넣을 수 있어요.</p>
  </div>`;
  document.body.appendChild(wrap);
  setTimeout(()=>document.getElementById('dAdd').focus(),40);
}
function closeDay(){const b=document.getElementById('dayBg'); if(b)b.remove(); if(memoRec){try{memoRec.stop()}catch(e){}; memoRec=null;}}
document.body.addEventListener('click',e=>{
  const bg=e.target.closest('#dayBg'); if(!bg)return;
  if(e.target.closest('[data-dclose]')||e.target.id==='dayBg'){closeDay(); return;}
  const dm=e.target.closest('[data-dm]');
  if(dm){const key=bg.dataset.day2, keep=(document.getElementById('dAdd')||{}).value||'', keepT=(document.getElementById('dTime')||{}).value||''; dayAddMode=dm.dataset.dm; closeDay(); openDay(key); const i=document.getElementById('dAdd'); if(i){i.value=keep;} const it=document.getElementById('dTime'); if(it&&keepT){it.value=keepT;} return;}
  if(e.target.closest('[data-dsave]')){
    const key=bg.dataset.day2, inp=document.getElementById('dAdd'), v=(inp.value||'').trim();
    if(!v)return;
    const [y,m,d]=key.split('-').map(Number); const now=new Date();
    const isToday=(now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===d);
    const mode=dayAddMode;
    const tv=(document.getElementById('dTime')||{}).value||'';
    const [th,tm2]=tv?tv.split(':').map(Number):[null,null];
    if(mode==='todo'){
      // 할 일: 입력한 시각이 마감. 완료 전까지 달력에 빨간 점으로 남는다.
      const {due,urgent,asap,clean}=parseKorean(v);
      const hm=due?new Date(due):null;
      const hh = th!==null?th : (hm?hm.getHours():9), mi = th!==null?tm2 : (hm?hm.getMinutes():0);
      tasks.push({id:uid(),text:clean,due:new Date(y,m,d,hh,mi).getTime(),urgent,asap,done:false,completedAt:null,note:null,created:Date.now()});
    }else{
      // 한 일: 입력한 시각 그대로 기록한다(나중에 정리해도 실제 통화 시각을 남길 수 있게)
      const ms = th!==null ? new Date(y,m,d,th,tm2).getTime() : (isToday?Date.now():new Date(y,m,d,12,0).getTime());
      tasks.push({id:uid(),text:v,due:null,urgent:false,asap:false,done:true,completedAt:ms,note:null,created:Date.now()});
    }
    save(); closeDay(); render(); openDay(key); return;}
  if(e.target.closest('#dMic')){
    const btn=e.target.closest('#dMic'), inp=document.getElementById('dAdd');
    if(memoRec){try{memoRec.stop()}catch(err){} return;}
    const S=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!S){inp.placeholder='이 브라우저는 음성이 안 돼요.'; return;}
    memoRec=new S(); memoRec.lang='ko-KR'; memoRec.interimResults=true;
    memoRec.onstart=()=>btn.classList.add('on');
    memoRec.onresult=ev=>{let f='',i='';for(let k=0;k<ev.results.length;k++){const r=ev.results[k]; r.isFinal?f+=r[0].transcript:i+=r[0].transcript;} inp.value=(f+i).trim();};
    memoRec.onend=()=>{btn.classList.remove('on'); memoRec=null;};
    memoRec.onerror=()=>{btn.classList.remove('on'); memoRec=null;};
    memoRec.start(); return;}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEdit(); closeDay();}});

const APP_VER='v0.5 · 9/20';
document.getElementById('ver').textContent=APP_VER;

/* 앱을 열면 바로 듣기 — 빅스비로 열고 손 안 대고 말하려는 용도.
   주소에 ?mic=1 을 붙여도 한 번만 켜진다. */
const MICKEY=KEY+'.automic';
let autoMic=localStorage.getItem(MICKEY)==='1';
document.getElementById('setBtn').onclick=openSet;
const wantMic = autoMic || new URLSearchParams(location.search).get('mic')==='1';
if(wantMic && SR){ setTimeout(()=>{ try{micBtn.click()}catch(e){} }, 400); }
// 첫 실행 예시 — 선언이 다 끝난 뒤에 돌아야 한다
if(!localStorage.getItem(KEY+'.seen')){localStorage.setItem(KEY+'.seen','1'); if(tasks.length===0){add('이 앱 폰 크롬에서 열어 🎙️ 눌러보기'); addMode='todo'; add('세금계산서 발행 빨리'); add('내일 오후 3시 병원 예약');}}
syncModes(); render(); setInterval(render,60000);
if(fixedFutureDone){document.getElementById('hint').textContent=`아직 안 온 날인데 '한 일'로 저장돼 있던 ${fixedFutureDone}개를 할 일로 되돌렸어요.`;}

// 새 버전이 올라오면 알아서 갈아끼운다
if('serviceWorker' in navigator){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // 앱을 다시 열 때마다 새 버전이 있는지 확인한다
      document.addEventListener('visibilitychange',()=>{ if(!document.hidden)reg.update().catch(()=>{}); });
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller) location.reload();
        });
      });
    }).catch(()=>{});
  });
}
</script>
